name: flowmap
description: "FlowMap — Value Stream Mapping builder and production flow simulator."
# Private app: never published to pub.dev.
publish_to: 'none'

# The drop's version. It is not what the app reports - the build label comes
# from --dart-define (lib/src/app/build_info.dart) - but it is what Flutter
# compiles into flowmap.exe's FileVersion, which is the version Windows,
# Explorer and an IT allow-list read off the file. Left at Flutter's 0.1.0
# default it said the shipped 2.1.2 exe was a 0.1.0 nobody had released.
# Bump it in the commit that is packaged; package_windows.ps1 checks that it
# agrees with -Label and refuses if it does not.
version: 2.1.2+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State. Long-lived singletons (database, router) are keepAlive providers.
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Storage. One local SQLite database holds resources, projects, studies,
  # templates and simulation runs (DESIGN.md §2).
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1

  go_router: ^17.3.0
  uuid: ^4.6.0

  # Matrix4, used by the canvas layout. Flutter re-exports it, but
  # `flow_layout.dart` is deliberately widget-free so that the map's geometry
  # can be asserted without pumping a frame — it takes the type from the
  # geometry package rather than pulling widgets in to reach it.
  vector_math: any

  # Formatting and locales. Durations render as HH:MM:SS, dates per app locale
  # (DESIGN.md §12.4).
  intl: any
  flutter_localizations:
    sdk: flutter

  # Windows remembers nothing about an application's window on its own.
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2

  # Exports. The PDF is a re-render of the same view model, not a screenshot,
  # so it stays vector and text-selectable (DESIGN.md §13).
  pdf: ^3.12.0
  file_selector: ^1.1.0
  excel: ^4.0.6
  # Reading and writing `.flowmap` documents, which are zips (#24, #37).
  # Already resolved transitively via `excel`; named here because lib/ imports it.
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  drift_dev: ^2.34.0
  # Drives migration fixtures in tests: opens a database in an old shape before
  # the current AppDatabase migrates it (DATA.md).
  sqlite3: ^3.5.0
  # Points appDataDirectory() at a temp folder, so window.json can be written
  # and read for real rather than mocked (#18). Transitive via path_provider,
  # but imported directly here, which the analyzer rightly wants declared.
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0

flutter:
  uses-material-design: true

  # The app's first assets, and they are fonts, not images (#27). A PDF that
  # does not embed its font falls back to Helvetica under WinAnsiEncoding, which
  # silently dropped the em dash and could not draw ▽/▲ at all. Roboto is
  # Apache-2.0 and is the face the screen already uses. DejaVu Sans (Bitstream
  # Vera licence) is the fallback for the two characters Roboto lacks and the
  # PDFs print: ⇄, the balanced mark, and →, a run's span.
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/LICENSE-Roboto.txt
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/LICENSE-DejaVu.txt

  # Generate localized strings (ARB -> AppLocalizations) via `flutter gen-l10n`.
  # Config lives in l10n.yaml at the repo root.
  generate: true
